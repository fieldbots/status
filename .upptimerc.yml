# Upptime configuration — FieldBots status page
# Docs: https://upptime.js.org/docs/configuration

owner: fieldbots
repo: status

sites:
  - name: FieldBots Website
    url: https://fieldbots.com
  - name: Biggest Fleet Website
    url: https://biggestfleet.com
  - name: FieldBots App
    url: https://apps.fieldbots.com
  - name: FieldBots Fleet API (Europe)
    url: https://connect.fieldbots.com
  - name: FieldBots Fleet API (North America)
    url: https://us.connect.fieldbots.com
  - name: FieldBots Keycloak (Auth)
    url: https://auth.fieldbots.com/auth/realms/master

status-website:
  baseUrl: /status
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: FieldBots Status
  introTitle: "**FieldBots** system status."
  introMessage: Real-time availability of the FieldBots platform. Incidents are tracked in our [GitHub repository](https://github.com/fieldbots/status).
  navbar:
    - title: Status
      href: /status/
    - title: FieldBots
      href: https://fieldbots.com
    - title: GitHub
      href: https://github.com/fieldbots/status
